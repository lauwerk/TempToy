<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5-Schnitt-Rechner</title>
<meta name="tool-icon" content="📐">
<link rel="stylesheet" href="../print.css" media="print">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--ln:#d9d7d2;--ac:#1f6feb;--ok:#1a7f37;--bad:#c62828;--wood:#ead5aa;--woodln:#b8955a;--strip:#d2b47a;--fence:#5a5a5a;--blade:#d93025}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mu:#9a9a9f;--ln:#333;--ac:#4c8dff;--ok:#3fb950;--bad:#ff6b6b;--wood:#6b5536;--woodln:#a88a5a;--strip:#8a6d42;--fence:#9a9a9a;--blade:#ff5a4f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.3 -apple-system,system-ui,sans-serif;padding:max(10px,env(safe-area-inset-top)) 14px 14px}
main{max-width:480px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{font-size:18px;margin:0}
.ghost{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:4px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
label{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu);display:block}
input{width:100%;font-size:17px;padding:5px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);margin-top:1px;-webkit-appearance:none}
.opt{display:flex;align-items:center;gap:8px;margin-top:5px}
.opt span{font-size:11.5px;color:var(--mu);width:68px;flex:none}
.seg{display:flex;flex:1;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);color:var(--tx);padding:5px 4px;font-size:13px}
.seg button+button{border-left:1px solid var(--ln)}
.seg button.on{background:var(--ac);color:#fff}
.calc{width:100%;margin-top:6px;padding:9px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;margin-top:6px}
.big{font-size:21px;line-height:1.15;font-weight:700}
.sub{font-size:12.5px;color:var(--mu)}
.dir{font-size:13.5px;font-weight:600}
svg{display:block;width:100%;height:auto}
.inpic{margin-top:5px;padding:2px 6px}
.row svg{height:58px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row .card{margin-top:0;padding:6px 8px}
.cap{font-size:12px;text-align:center;line-height:1.2}
.cap b{font-size:14px}
.err{color:var(--bad)}
.okc{color:var(--ok)}
.hint{font-size:11.5px;color:var(--mu);margin-top:8px;text-align:center}
.printdate{display:none}
@media print{.printdate{display:block;font-size:12px;color:#666}.ghost,.calc{display:none}}
</style>
</head>
<body>
<main>
<header>
  <h1>📐 5-Schnitt-Rechner</h1>
  <button class="ghost" onclick="window.print()">Als PDF sichern</button>
</header>
<p class="printdate" id="printdate"></p>

<div class="grid">
  <div><label for="a">A – Streifen, weg von dir (mm)</label><input id="a" type="text" inputmode="decimal" autocomplete="off"></div>
  <div><label for="b">B – Streifen, zu dir (mm)</label><input id="b" type="text" inputmode="decimal" autocomplete="off"></div>
  <div><label for="l">L – Messabstand A↔B (mm)</label><input id="l" type="text" inputmode="decimal" autocomplete="off"></div>
  <div><label for="d">D – Drehpunkt↔Verstellpunkt</label><input id="d" type="text" inputmode="decimal" autocomplete="off"></div>
</div>
<div class="opt"><span>Werkstück</span>
  <div class="seg" data-k="w"><button data-v="L">links vom Blatt</button><button data-v="R">rechts vom Blatt</button></div>
</div>
<div class="opt"><span>Drehpunkt</span>
  <div class="seg" data-k="p"><button data-v="L">links</button><button data-v="M">am Blatt</button><button data-v="R">rechts</button></div>
</div>
<div class="card inpic" id="inpic"></div>
<button class="calc" id="calc">Berechnen</button>

<div id="out"></div>
</main>

<script>
const KEY='temptoy-fivecut';
const F=['a','b','l','d'];
let st={a:'',b:'',l:'',d:'',w:'L',p:'M'};

function load(){
  let o=null;
  try{const m=location.hash.match(/s=([^&]+)/);if(m)o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));}catch(e){}
  if(!o){try{const s=localStorage.getItem(KEY);if(s)o=JSON.parse(s);}catch(e){}}
  if(o)Object.assign(st,o);
  if(!['L','R'].includes(st.w))st.w='L';
  if(!['L','M','R'].includes(st.p))st.p='M';
}
function save(){
  const j=JSON.stringify(st);
  try{localStorage.setItem(KEY,j);}catch(e){}
  try{history.replaceState(null,'','#s='+btoa(unescape(encodeURIComponent(j))));}catch(e){}
}
const num=v=>parseFloat(String(v).trim().replace(',','.'));
const fmt=(x,n=4)=>x.toLocaleString('de-DE',{minimumFractionDigits:n,maximumFractionDigits:n});

// Seite des Verstellpunkts relativ zum Drehpunkt: +1 rechts, -1 links
function adjSide(w,p){return p==='L'?1:p==='R'?-1:(w==='L'?-1:1);}

/* Draufsicht: Sägeblatt senkrecht in der Mitte, Anschlag unten (bei dir),
   Werkstück auf gewählter Seite, Abschnittstreifen auf der anderen Seite. */
function sled(o){
  const inp=o.mode==='in', top=12, bx=170;
  const fy=inp?72:(o.up?78:52), H=inp?102:(o.up?96:100);
  const P={L:40,M:bx,R:300}[o.p];
  const s1=adjSide(o.w,o.p);
  const AX=o.p==='M'?(s1<0?40:300):(o.p==='L'?300:40);
  const wb=o.w==='L'?[22,bx-4]:[bx+4,318];
  const sb=o.w==='L'?[bx+4,bx+28]:[bx-28,bx-4];
  let s=`<svg viewBox="0 0 340 ${H}" role="img">
  <defs><marker id="ar${o.mode}" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--ac)"/></marker></defs>
  <rect x="${wb[0]}" y="${top}" width="${wb[1]-wb[0]}" height="${fy-4-top}" fill="var(--wood)" stroke="var(--woodln)"/>
  <text x="${(wb[0]+wb[1])/2}" y="${top+18}" text-anchor="middle" font-size="12" fill="var(--tx)" opacity=".7">Werkstück</text>`;
  if(inp){
    const sx=(sb[0]+sb[1])/2, lx=o.w==='L'?sb[1]+10:sb[0]-10, la=o.w==='L'?'start':'end';
    s+=`<rect x="${sb[0]}" y="${top}" width="${sb[1]-sb[0]}" height="${fy-4-top}" fill="var(--strip)" stroke="var(--woodln)"/>
    <text x="${sx}" y="${top+14}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tx)">A</text>
    <text x="${sx}" y="${fy-10}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tx)">B</text>
    <line x1="${lx-4}" y1="${top+4}" x2="${lx-4}" y2="${fy-8}" stroke="var(--mu)" stroke-width="1"/>
    <line x1="${lx-8}" y1="${top+4}" x2="${lx}" y2="${top+4}" stroke="var(--mu)"/>
    <line x1="${lx-8}" y1="${fy-8}" x2="${lx}" y2="${fy-8}" stroke="var(--mu)"/>
    <text x="${o.w==='L'?lx+2:lx-10}" y="${(top+fy)/2+2}" text-anchor="${la}" font-size="11" fill="var(--mu)">L</text>
    <text x="${o.w==='L'?sb[1]+4:sb[0]-4}" y="${top-2}" text-anchor="${o.w==='L'?'start':'end'}" font-size="9" fill="var(--mu)">Streifen 5. Schnitt</text>`;
  }
  s+=`<rect x="${bx-3}" y="4" width="6" height="${fy+10}" fill="var(--blade)" rx="2"/>
  <rect x="14" y="${fy-4}" width="312" height="8" fill="var(--fence)" rx="2"/>`;
  if(inp){
    const dy=fy+14, mx=(P+AX)/2;
    s+=`<line x1="${P}" y1="${dy}" x2="${AX}" y2="${dy}" stroke="var(--ac)"/>
    <line x1="${P}" y1="${dy-4}" x2="${P}" y2="${dy+4}" stroke="var(--ac)"/>
    <line x1="${AX}" y1="${dy-4}" x2="${AX}" y2="${dy+4}" stroke="var(--ac)"/>
    <text x="${mx}" y="${dy+14}" text-anchor="middle" font-size="11" fill="var(--ac)">D</text>
    <rect x="${AX-4}" y="${fy-4}" width="8" height="8" fill="var(--ac)"/>`;
  }else{
    const gy=o.up?fy-14:fy+14, ay2=o.up?fy-36:fy+34;
    const tx=AX<150?AX+10:AX-10, ta=AX<150?'start':'end';
    s+=`<line x1="${P}" y1="${fy}" x2="${AX}" y2="${gy}" stroke="var(--ac)" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="${AX}" y1="${fy}" x2="${AX}" y2="${ay2}" stroke="var(--ac)" stroke-width="3" marker-end="url(#ar${o.mode})"/>
    <text x="${tx}" y="${o.up?fy-20:fy+28}" text-anchor="${ta}" font-size="13" font-weight="700" fill="var(--ac)">${o.txt}</text>`;
  }
  s+=`<circle cx="${P}" cy="${fy}" r="6" fill="var(--card)" stroke="var(--tx)" stroke-width="2"/>
  <text x="336" y="${H-3}" text-anchor="end" font-size="11" fill="var(--mu)">▼ du</text>
  </svg>`;
  return s;
}

function devSvg(obtuse,w){
  const X=x=>w==='L'?x:160-x;
  const s=obtuse?20:-20, e=108+s;
  return `<svg viewBox="0 0 160 105" role="img" aria-label="Winkelabweichung">
  <polygon points="${X(12)},92 ${X(108)},92 ${X(e)},18 ${X(12)},18" fill="var(--wood)" stroke="var(--woodln)"/>
  <line x1="${X(108)}" y1="92" x2="${X(108)}" y2="10" stroke="var(--mu)" stroke-dasharray="3 3"/>
  <line x1="${X(108)}" y1="92" x2="${X(e)}" y2="18" stroke="var(--bad)" stroke-width="2.5"/>
  <rect x="${w==='L'?4:36}" y="92" width="120" height="8" fill="var(--fence)" rx="1"/>
  <line x1="${X(108)}" y1="14" x2="${X(e)}" y2="14" stroke="var(--bad)" stroke-width="1.5"/>
  <text x="${X(108+s/2)}" y="10" text-anchor="middle" font-size="10" fill="var(--bad)">Δ</text>
  <text x="${X(100)}" y="88" text-anchor="${w==='L'?'end':'start'}" font-size="9" fill="var(--mu)">${obtuse?'&gt; 90°':'&lt; 90°'}</text>
</svg>`;
}

function paint(){
  document.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===st[g.dataset.k])));
  document.getElementById('inpic').innerHTML=sled({mode:'in',w:st.w,p:st.p});
}

function calc(){
  const A=num(st.a),B=num(st.b),L=num(st.l),D=num(st.d);
  const out=document.getElementById('out');
  if([A,B,L,D].some(isNaN)){out.innerHTML='<p class="hint err">Bitte alle vier Werte eingeben.</p>';return;}
  if(L<=0||D<=0){out.innerHTML='<p class="hint err">L und D müssen größer 0 sein.</p>';return;}
  const delta=B-A;                 // >0: Streifen am Anschlag (bei dir) breiter
  const t=delta/(4*L);             // tan(Winkelfehler je Schnitt)
  const eDeg=Math.atan(t)*180/Math.PI;
  const phi=(st.w==='L'?1:-1)*t;   // Verdrehung Anschlag, gegen Uhrzeiger (von oben) positiv
  const s1=adjSide(st.w,st.p);
  const dy=s1*D*(-phi);            // >0: Verstellpunkt von dir weg
  const adj=Math.abs(dy);
  const d100=Math.abs(100*t), d1000=Math.abs(1000*t);
  if(adj<0.00005&&d1000<0.00005){
    out.innerHTML='<div class="card"><div class="big okc">✓ 90° – passt</div><div class="sub">Keine messbare Abweichung, nichts verstellen.</div></div>';return;
  }
  const up=dy>0;
  const obtuse=delta>0;            // Winkel am Werkstück > 90°
  const endName=s1>0?'Rechtes Anschlagende':'Linkes Anschlagende';
  const dirTxt=up?'von dir weg':'zu dir hin';
  out.innerHTML=`
  <div class="card">
    <div class="sub">Anschlag verstellen um</div>
    <div class="big">${fmt(adj)} mm</div>
    <div class="dir">${endName} ${dirTxt}</div>
    ${sled({mode:'out',w:st.w,p:st.p,up,txt:fmt(adj)+' mm'})}
    <div class="sub">Winkel jetzt ${fmt(90+eDeg)}° · überhöht dargestellt</div>
  </div>
  <div class="card" style="padding:6px 8px 8px">
    <div class="sub" style="margin-bottom:4px">Abweichung von 90° – Kante läuft ${obtuse?'nach außen (stumpf)':'nach innen (spitz)'}</div>
    <div class="row">
      <div class="card">${devSvg(obtuse,st.w)}<div class="cap">auf 100 mm<br><b>${fmt(d100)} mm</b></div></div>
      <div class="card">${devSvg(obtuse,st.w)}<div class="cap">auf 1000 mm<br><b>${fmt(d1000)} mm</b></div></div>
    </div>
  </div>`;
}

load();
F.forEach(k=>{const el=document.getElementById(k);el.value=st[k]||'';
  el.addEventListener('input',()=>{st[k]=el.value;save();});});
document.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{st[g.dataset.k]=b.dataset.v;paint();save();})));
paint();
document.getElementById('calc').addEventListener('click',()=>{document.activeElement.blur();calc();});
document.getElementById('printdate').textContent='Stand: '+new Date().toLocaleString('de-DE');
</script>
</body>
</html>
