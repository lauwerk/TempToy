<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katastrophenschutz-Vorsorge</title>
<meta name="tool-icon" content="🔦">
<meta name="theme-color" content="#1c2326">
<link rel="stylesheet" href="../print.css" media="print">
<style>
/* Plan: ruhige Werkstatt-Optik, Signalorange als einziger Akzent; eine Spalte, unten Tab-Leiste; Karten mit Ampel-Streifen */
:root{
  --bg:#f2f3f1; --card:#ffffff; --tx:#1c2326; --mu:#5f6a6f; --ln:#dadfdc;
  --ac:#d9480f; --ac-soft:#fde7da;
  --ok:#2e7d4f; --ok-soft:#dcf0e3; --warn:#a96800; --warn-soft:#fbefd0; --bad:#c62828; --bad-soft:#fbe1df; --neu:#8a9397; --neu-soft:#eceeed;
  --tab:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111517; --card:#1b2124; --tx:#e8ecec; --mu:#9aa5aa; --ln:#2c3438;
  --ac:#ff7a3d; --ac-soft:#3a2418;
  --ok:#5cc98a; --ok-soft:#163023; --warn:#e2a93b; --warn-soft:#33270f; --bad:#ff6b63; --bad-soft:#3a1816; --neu:#7f898d; --neu-soft:#242b2e;
  --tab:#171c1e;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:17px;margin:18px 0 8px}
h3{font-size:15px;margin:0}
p{margin:0 0 8px}
.mu{color:var(--mu)}
.sm{font-size:13px}
.xs{font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.big{width:100%;padding:14px;font-size:16px;border-radius:12px}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-bald,.s-neu.warnish{background:var(--warn-soft);color:var(--warn)}
.s-fehlt,.s-ablauf,.s-problem{background:var(--bad-soft);color:var(--bad)}
.s-neu{background:var(--neu-soft);color:var(--mu)}
.s-faellig{background:var(--warn-soft);color:var(--warn)}
/* Kopf */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ro-banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin:8px 0}
/* Übersicht */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:84px;height:84px}
.ring text{font:700 20px var(--font);fill:var(--tx)}
.next{border-left:4px solid var(--ac)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px 10px 14px;position:relative;text-align:left;width:100%}
.fld::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--neu)}
.fld.ok::before{background:var(--ok)} .fld.warn::before{background:var(--warn)} .fld.bad::before{background:var(--bad)}
.fld b{display:block;font-size:14px}
.fld span{font-size:12px;color:var(--mu)}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:left}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mu)}
/* Check */
.prog{height:6px;background:var(--neu-soft);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--ac);transition:width .25s}
.ccard{min-height:300px;display:flex;flex-direction:column;gap:12px}
.ccard .feld{font-size:12px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.06em}
.ccard h3{font-size:20px;line-height:1.25}
.hint{background:var(--neu-soft);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--mu)}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper button{height:56px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-size:26px;font-weight:600}
.stepper output{text-align:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stepper output small{display:block;font-size:12px;font-weight:500;color:var(--mu)}
.mhd{display:flex;gap:8px;align-items:center}
.mhd label{font-size:13px;color:var(--mu);flex:none}
.mhd input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{padding:16px 8px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-weight:700;font-size:15px}
.choice button.on.okb{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.choice button.on.badb{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:auto}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:8px;font-size:13px;font-weight:600}
.seg button.on{background:var(--tx);color:var(--bg)}
/* Listen */
.list .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--ln);align-items:center}
.list .it:first-child{border-top:0}
.it .nm{font-weight:600}
.it .meta{font-size:12.5px;color:var(--mu)}
.mini{display:flex;align-items:center;gap:4px}
.mini button{width:34px;height:34px;border-radius:9px;border:1px solid var(--ln);background:var(--card);font-weight:700}
.mini button.tick{width:auto;padding:0 10px}
.mini output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tick{padding:7px 10px;border-radius:9px;border:1px solid var(--ln);background:var(--card);font-weight:700;font-size:13px}
.tick.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tick.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
details.grp{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin-bottom:10px}
details.grp>summary{list-style:none;padding:12px 14px;display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"›";margin-left:auto;color:var(--mu);font-size:20px;line-height:1;transition:transform .2s}
details.grp[open]>summary::after{transform:rotate(90deg)}
details.grp .list{padding:0 14px 6px}
/* Formulare */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--mu);font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
.field textarea{min-height:120px;resize:vertical;font-size:14px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tab);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tabs button{border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ac)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;min-width:16px;line-height:16px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.dialog .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.empty{text-align:center;padding:24px 10px;color:var(--mu)}
.printonly{display:none}
.mappe-pg h3{margin-top:12px}
.mappe-pg pre{white-space:pre-wrap;font:14px/1.5 var(--font);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .tabs,.toast,.no-print,.dialog{display:none!important}
  .wrap{padding:0}
  .card{border:1px solid #ccc!important;break-inside:avoid}
  .pg{break-inside:avoid}
  .pg-neu{break-before:page}
  .printonly{display:block!important}
  details.grp{border:0}
  details.grp>summary::after{display:none}
}
</style>
</head>

var LS = "temptoy-katastrophenschutz-v1";
var state, readOnly = false, view = "home", checkMode = "karte", editId = null;

function deep(o){ return JSON.parse(JSON.stringify(o)); }
function frisch(){
  return {v:1, vv:VORLAGE_V, t:Date.now(), name:"Unser Haushalt", personen:3, tage:14,
    items: VORLAGE.map(function(it){ var c = deep(it); c.ist = null; c.mhd = null; c.ok = null; c.last = null; c.notiz = ""; return c; }),
    mappe: MAPPE.map(function(m){ return {id:m.id, n:m.n, v:m.v}; }),
    session: null, verlauf: [], erledigt: {}};
}
function sollVon(it){
  if(it.soll == null) return null;
  if(it.pp && state.personen !== 3) return Math.max(1, Math.round(it.soll * state.personen / 3 / (it.st||1)) * (it.st||1));
  return it.soll;
}
function minVon(it){
  var s = sollVon(it);
  if(it.min != null){ return it.pp && state.personen !== 3 ? Math.round(it.min * state.personen / 3 * 10)/10 : it.min; }
  return s;
}
function fmt(n){ return (Math.round(n*10)/10).toLocaleString("de-DE"); }

/* Datum */
function heute(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function ym(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function letzterSonntag(y, m){ var d = new Date(y, m+1, 0); d.setDate(d.getDate() - d.getDay()); d.setHours(0,0,0,0); return d; }
function dt(d){ return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function addMon(d, n){ var x = new Date(d); x.setMonth(x.getMonth()+n); return x; }
function naechsteTermine(ab){
  var y = ab.getFullYear(), list = [];
  for(var k = y-1; k <= y+2; k++){ list.push({d:letzterSonntag(k,2), saison:"f"}); list.push({d:letzterSonntag(k,9), saison:"h"}); }
  list.sort(function(a,b){ return a.d - b.d; });
  return list;
}
function saisonName(s){ return s === "f" ? "Frühjahrs-Check" : s === "h" ? "Herbst-Check" : "Erst-Check"; }

/* Nächster Check: der erste Zeitumstellungs-Termin nach dem letzten Check */
function nextCheck(){
  var last = state.verlauf.length ? new Date(state.verlauf[state.verlauf.length-1].datum) : null;
  var offen = state.items.some(function(i){ return i.t !== "u" && status(i) === "neu"; });
  if(!last || offen) return {erst:true, saison:"e", d:heute(), faellig:true, weiter: !!last};
  var ts = naechsteTermine(last);
  var cutoff = new Date(last.getTime() + 30*86400000); // ein Check zählt für den Termin der nächsten 30 Tage
  for(var i=0;i<ts.length;i++){ if(ts[i].d > cutoff) { var d = ts[i].d; return {saison:ts[i].saison, d:d, faellig: heute() >= new Date(d.getTime() - 14*86400000)}; } }
  return {saison:"h", d:heute(), faellig:true};
}

/* Status je Position */
function status(it){
  if(it.t === "u"){
    if(!it.last) return "faellig";
    if(!it.i) return "ok";
    var due = addMon(new Date(it.last), it.i);
    return due <= addMon(heute(), 1) ? "faellig" : "ok";
  }
  if(it.t === "p"){
    if(it.ok === null) return "neu";
    if(it.ok === false) return "problem";
  } else {
    if(it.ist === null) return "neu";
    if(it.ist < minVon(it)) return "fehlt";
  }
  if(it.x && it.mhd){
    var now = ym(heute()), soon = ym(addMon(heute(), 6));
    if(it.mhd < now) return "ablauf";
    if(it.mhd <= soon) return "bald";
  }
  return "ok";
}
var SL = {ok:"passt", neu:"nicht erfasst", fehlt:"fehlt", problem:"Problem", ablauf:"abgelaufen", bald:"bald fällig", faellig:"fällig"};
function feldAmpel(fid){
  var its = state.items.filter(function(i){ return i.f === fid; });
  var st = its.map(status);
  if(st.some(function(s){ return s==="fehlt"||s==="ablauf"||s==="problem"; })) return "bad";
  if(st.some(function(s){ return s==="neu"||s==="bald"||s==="faellig"; })) return "warn";
  return "ok";
}

/* Speichern: localStorage + komprimierter Stand im URL-Fragment */
var saveTimer = null;
function save(msg){
  if(readOnly) return;
  state.t = Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ encode(state).then(function(h){ try{ history.replaceState(null, "", "#z=" + h); }catch(e){} }); }, 800);
  if(msg) toast(msg);
}
function b64u(bytes){ var s = ""; for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(str){ str = str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str += "="; var s = atob(str), b = new Uint8Array(s.length); for(var i=0;i<s.length;i++) b[i] = s.charCodeAt(i); return b; }
function encode(obj){
  var raw = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream === "undefined") return Promise.resolve(b64u(raw));
  var cs = new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Response(cs).arrayBuffer().then(function(buf){ return "1" + b64u(new Uint8Array(buf)); });
}
function decode(h){
  if(h.charAt(0) !== "1") return Promise.resolve(JSON.parse(new TextDecoder().decode(unb64u(h))));
  var ds = new Blob([unb64u(h.slice(1))]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Response(ds).text().then(JSON.parse);
}
function migrate(s){
  // neue Vorlagen-Positionen ergänzen, ohne Kevins Änderungen zu überschreiben
  if(!s || !s.items) return frisch();
  var have = {}; s.items.forEach(function(i){ have[i.id] = 1; });
  if(!s.entfernt) s.entfernt = {};
  VORLAGE.forEach(function(v){ if(!have[v.id] && !s.entfernt[v.id]){ var c = deep(v); c.ist=null; c.mhd=null; c.ok=null; c.last=null; c.notiz=""; s.items.push(c); } });
  if(!s.mappe) s.mappe = MAPPE.map(function(m){ return {id:m.id,n:m.n,v:m.v}; });
  var vv = s.vv || 1;
  for(var ver = vv + 1; ver <= VORLAGE_V; ver++){
    var alt = VORLAGE_ALT[ver]; if(!alt) continue;
    s.items.forEach(function(it){
      var a = alt.items[it.id]; if(!a) return;
      var v = VORLAGE.filter(function(x){ return x.id === it.id; })[0]; if(!v) return;
      Object.keys(a).forEach(function(k){ if((it[k] || null) === a[k]) it[k] = v[k]; });
    });
    s.mappe.forEach(function(m){
      var a = alt.mappe[m.id]; if(a === undefined) return;
      var v = MAPPE.filter(function(x){ return x.id === m.id; })[0];
      if(v && m.v === a) m.v = v.v;
    });
  }
  s.vv = VORLAGE_V;
  if(!s.verlauf) s.verlauf = [];
  if(!s.personen) s.personen = 3;
  return s;
}

var app = document.getElementById("app");
function h(tag, attrs, kids){
  var el = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if(k === "class") el.className = v;
    else if(k === "text") el.textContent = v;
    else if(k === "html") el.innerHTML = v;
    else if(k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  });
  (kids||[]).forEach(function(c){ if(c == null) return; el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return el;
}
function toast(t){ var el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.tm); toast.tm = setTimeout(function(){ el.classList.remove("show"); }, 1800); }

function feldName(fid){ for(var i=0;i<FELDER.length;i++) if(FELDER[i].id===fid) return FELDER[i].n; return fid; }
function byId(id){ for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return state.items[i]; return null; }
function copy(text, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(ok); }, function(){ showText(text); });
  } else showText(text);
}
function showText(text){
  dialog("Zum Kopieren markieren", [h("div",{class:"field"},[h("textarea",{id:"copy-ta", readonly:true, text:text, style:"min-height:220px"})])]);
  setTimeout(function(){ var ta = document.getElementById("copy-ta"); if(ta){ ta.focus(); ta.select(); } }, 50);
}
function dialog(title, body, actions){
  var d = h("div",{class:"dialog", onclick:function(e){ if(e.target === d) d.remove(); }});
  var sheet = h("div",{class:"sheet", role:"dialog", "aria-label":title},[h("h2",{text:title, style:"margin-top:0"})].concat(body).concat([
    h("div",{class:"row", style:"margin-top:12px;justify-content:flex-end"},(actions||[]).concat([h("button",{class:"btn", id:"dlg-close", text:"Schließen", onclick:function(){ d.remove(); }})]))
  ]));
  d.appendChild(sheet); document.body.appendChild(d);
  return d;
}

  }).sort(function(a,b){ return FELDER.findIndex(function(f){return f.id===a.f;}) - FELDER.findIndex(function(f){return f.id===b.f;}); }).map(function(i){ return i.id; });
}

    w.s = fS[1].value === "a" ? undefined : fS[1].value; w.i = parseInt(fI[1].value,10);
    w.o = fO[1].value || undefined; w.h = fH.value || undefined; w.x = fX.checked ? 1 : undefined; w.pp = fP.checked ? 1 : undefined;
    if(w.t === "m" && (w.soll == null || isNaN(w.soll))){ toast("Bitte eine Soll-Menge eintragen"); return; }
    if(neu) state.items.push(w); else { var k = state.items.indexOf(it); state.items[k] = w; }
    save("Gespeichert"); document.querySelector(".dialog").remove(); render();
  }})];
  if(!neu) acts.unshift(h("button",{class:"btn", id:"e-del", style:"color:var(--bad)", text:"Löschen", onclick:function(){
    state.items.splice(state.items.indexOf(it),1);
    if(!state.entfernt) state.entfernt = {};
    state.entfernt[it.id] = 1;
    if(state.session){ var p = state.session.ids.indexOf(it.id); if(p>=0) state.session.ids.splice(p,1); }
    save("Gelöscht"); document.querySelector(".dialog").remove(); render();
  }}));
  dialog(neu ? "Neue Position" : "Position ändern", body, acts);
}

function load(){
  var local = null;
  try{ local = JSON.parse(localStorage.getItem(LS) || "null"); }catch(e){}
  var hash = location.hash || "";
  var m = hash.match(/^#([zsr])=(.+)$/);
  if(m){
    var kind = m[1];
    var p = kind === "s" ? Promise.resolve(JSON.parse(decodeURIComponent(escape(atob(m[2]))))) : decode(m[2]);
    return p.then(function(o){
      if(kind === "r"){ readOnly = true; state = migrate(o); return; }
      if(local && local.t && o.t && local.t > o.t){ state = migrate(local); toast("Neuerer Stand auf diesem Gerät geladen"); return; }
      state = migrate(o);
    }).catch(function(){ state = migrate(local) ; toast("Link-Stand nicht lesbar, Gerätestand geladen"); });
  }
  state = local ? migrate(local) : frisch();
  return Promise.resolve();
}
load().then(function(){
  if(!state) state = frisch();
  if(!readOnly) save();
  render();
});
})();
